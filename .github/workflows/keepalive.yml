name: Keep-alive

# Prevents the Supabase free-tier project from auto-pausing due to inactivity.
# Pings the Render health endpoint, which exercises the DB connection and
# registers activity on Supabase. (Redundant once an UptimeRobot monitor is set
# up — see DEPLOY.md — but kept as a cheap backup that also re-arms the schedule.)
#
# NOTE: GitHub disables scheduled workflows on a repo after 60 days with no
# repo activity (commits, etc.). For a portfolio project that may sit idle,
# the manual `workflow_dispatch` trigger below lets you re-trigger it by hand,
# and any push re-arms the schedule.

on:
  schedule:
    # Every 3 days at 06:00 UTC. Cron has no "every 3 days" field, so we pin
    # to specific days of the month. Adjust if you want a tighter interval.
    - cron: "0 6 1,4,7,10,13,16,19,22,25,28 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          set -euo pipefail
          URL="https://quizki-be.onrender.com/actuator/health"
          echo "Pinging $URL"
          # --fail makes curl exit non-zero on HTTP >= 400.
          # Retry a few times in case Render is cold-starting the service.
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 30 "$URL"; then
              echo ""
              echo "Health check succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 5 attempts"
          exit 1
