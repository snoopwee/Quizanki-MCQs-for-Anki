spring:
  application:
    name: ankiquiz-be
  profiles:
    active: local

supabase:
  # HS256 signing secret from Supabase: Project Settings -> API -> JWT Secret.
  # Override per-environment via the SUPABASE_JWT_SECRET env var.
  jwt-secret: ${SUPABASE_JWT_SECRET:replace-me}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
