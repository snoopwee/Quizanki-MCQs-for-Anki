spring:
  application:
    name: ankiquiz-be
  profiles:
    active: local

  servlet:
    multipart:
      # We only read the small collection.anki* db, but the upload includes media
      # we discard, so the cap must fit the whole .apkg. 50MB covers ~95% of real
      # decks (typical JLPT / vocab / chapter exports) while keeping the free-tier
      # memory + egress bill bounded. Media-heavy multi-GB decks (full AnKing) are
      # intentionally out of scope; per-IP rate limiting is the real abuse backstop.
      max-file-size: 50MB
      max-request-size: 55MB

  datasource:
    # JDBC URL for the Supabase Postgres instance.
    # Format: jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Don't block startup if the DB is briefly unreachable.
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      # Schema is owned by Flyway. Hibernate only validates that entities match.
      # No entities yet (Phase 0) so this is effectively a no-op for now.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1 already ran manually in Supabase — baseline tells Flyway "treat existing
    # schema as the starting point" so it won't try to re-create the tables.
    # New Supabase projects without any tables: Flyway runs V1 normally.
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      url: ${UPSTASH_REDIS_URL:redis://localhost:6379}

supabase:
  # Project URL, e.g. https://<project-ref>.supabase.co
  # The JWKS endpoint and JWT issuer are derived from this.
  # Override per-environment via the SUPABASE_URL env var.
  url: ${SUPABASE_URL:https://replace-me.supabase.co}

tts:
  # Cloud text-to-speech fallback (Google Cloud TTS) for languages a visitor's
  # device has no voice for. ALL secrets default empty so the feature is dormant
  # until configured — with no api-key the endpoint returns 503 and the FE stays
  # on free device voices. See ROADMAP / the TTS setup notes.
  google:
    api-key: ${GOOGLE_TTS_API_KEY:}
  supabase:
    # Service-role key used only to write/read the audio cache bucket. Without it,
    # synthesized audio is returned inline (data URL) instead of being cached.
    service-key: ${SUPABASE_SERVICE_KEY:}
  cache:
    bucket: ${TTS_CACHE_BUCKET:tts-cache}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  # swagger-ui.path left at default (/swagger-ui/index.html) so the
  # /swagger-ui.html convenience redirect lands somewhere our security
  # config already allows via /swagger-ui/**.

server:
  # Most free hosts (Render, Cloud Run) inject the port to bind via $PORT; fall
  # back to 8080 for local dev.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Surface which sub-component is DOWN. Safe in dev; tighten in prod.
      show-details: always
  health:
    redis:
      # Phase 0 doesn't use Redis yet, so don't gate /actuator/health on it.
      enabled: false
