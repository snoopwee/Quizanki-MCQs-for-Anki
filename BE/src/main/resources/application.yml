spring:
  application:
    name: ankiquiz-be
  profiles:
    active: local

supabase:
  # Project URL, e.g. https://<project-ref>.supabase.co
  # The JWKS endpoint and JWT issuer are derived from this.
  # Override per-environment via the SUPABASE_URL env var.
  url: ${SUPABASE_URL:https://replace-me.supabase.co}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
